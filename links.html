<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harish Reddy Duggempudi | All my links</title>
<meta name="description" content="All links for Harish Reddy Duggempudi: Topmate mentoring, Instagram, YouTube, LinkedIn, GitHub, articles and projects.">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="links.html">
<meta property="og:type" content="profile">
<meta property="og:title" content="Harish Reddy Duggempudi | All my links">
<meta property="og:description" content="Mentoring, content, projects and socials in one place.">
<meta property="og:url" content="links.html">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/og-image.jpg">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{background:radial-gradient(520px 380px at 12% -4%,var(--glow),transparent 70%),radial-gradient(520px 420px at 100% 30%,var(--glow),transparent 70%),radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/22px 22px,var(--bg)}
.wrap{width:min(520px,100% - 32px);margin:0 auto;padding:3.2rem 0 1rem;text-align:center}
.ring{width:132px;height:132px;margin:0 auto 1.1rem;padding:5px;border-radius:50%;background:conic-gradient(from 0deg,var(--red),#ff8a3d,var(--red) 55%,transparent 75%,var(--red));animation:spin 6s linear infinite}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--bg);padding:5px}
.ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top;background:var(--card);animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(1turn)}}
h1{font-size:clamp(3.2rem,15vw,4.8rem)}
h1 span{color:var(--red)}
.bio{color:var(--mute);max-width:32ch;margin:.7rem auto 0}
.handle{display:inline-block;margin-top:.9rem;padding:.3rem .9rem;border:1px solid var(--line);border-radius:99px;font-size:.82rem;font-weight:600;background:var(--card)}
.soc{display:flex;justify-content:center;flex-wrap:wrap;gap:.65rem;margin:1.5rem 0 1.8rem}
.soc a{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:transform .2s,background .2s,border-color .2s,color .2s}
.soc a svg{width:22px;height:22px}
@media(hover:hover){.soc a:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-4px) rotate(-6deg)}}
.soc a:active{transform:scale(.94)}
ul.l{list-style:none;display:flex;flex-direction:column;gap:.8rem;text-align:left}
ul.l li{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 150ms)}
.lk{--x:50%;--y:50%;position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:1rem;min-height:76px;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:24px;background:var(--card);transition:border-color .2s,transform .2s}
.lk::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--x) var(--y),var(--glow),transparent 70%)}
.ic{flex:none;width:48px;height:48px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;color:var(--red);transition:background .2s,color .2s,border-color .2s}
.ic svg{width:22px;height:22px}
.tx{flex:1;min-width:0}
.tx b{display:block;font:400 1.7rem/.95 'Bebas Neue',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.tx span{display:block;color:var(--mute);font-size:.82rem;margin-top:.2rem;overflow-wrap:anywhere}
.ar{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,transform .25s,border-color .2s,color .2s}
@media(hover:hover){
.lk:hover{border-color:var(--red);transform:translateY(-3px)}
.lk:hover::before{opacity:1}
.lk:hover .ic{background:var(--red);color:#fff;border-color:var(--red)}
.lk:hover .ar{background:var(--red);border-color:var(--red);color:#fff;transform:rotate(45deg)}
.lk.f:hover{transform:translateY(-3px) scale(1.01)}
.lk.f:hover .ar{background:#0a0a0a;color:#fff;border-color:#0a0a0a;transform:none}}
.lk:active{transform:scale(.985)}
.lk.f{flex-wrap:wrap;min-height:150px;padding:1.4rem;border:0;background:linear-gradient(135deg,var(--red),#ff6a2b);color:#fff;box-shadow:0 18px 44px -18px var(--red)}
.lk.f::before{display:none}
.lk.f::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.2s ease-in-out 1.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.lk.f .ic{width:54px;height:54px;color:#fff;border-color:rgba(255,255,255,.55)}
.lk.f .tx b{font-size:2.8rem}
.lk.f .tx span{color:#ffe9e5;font-size:.9rem}
.lk.f .ar{width:auto;height:44px;padding:0 1.1rem;border-radius:99px;background:#fff;color:#0a0a0a;border-color:#fff;font-weight:600;font-size:.88rem}
.new{display:inline-block;margin-left:.5rem;padding:.12rem .6rem;border-radius:99px;background:var(--red);color:#fff;font:600 .68rem/1.5 Inter,sans-serif;letter-spacing:.04em;vertical-align:middle;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent;opacity:.75}}
.share{margin-top:1.8rem}
@media(max-width:380px){.lk.f .tx b{font-size:2.3rem}.tx b{font-size:1.5rem}}
</style>
</head>
<body>
<a class="skip" href="#list">Skip to links</a>
<button class="theme" id="theme" type="button" aria-label="Switch theme"></button>
<main class="wrap">
  <div class="ring"><div><img id="photo" alt="Portrait of Harish Reddy Duggempudi" width="112" height="112" fetchpriority="high" decoding="async"></div></div>
  <h1 class="d" id="name">Harish Reddy <span>Duggempudi</span></h1>
  <p class="bio" id="bio"></p>
  <span class="handle" id="handle"></span>
  <nav class="soc" id="soc" aria-label="Social media"></nav>
  <ul class="l" id="list" aria-label="My links"></ul>
  <noscript><p class="noscript">Please enable JavaScript to see my links, or visit <a href="https://www.instagram.com/hey.harish_reddy/">Instagram</a>.</p></noscript>
  <button class="pill share" id="share" type="button">Share this page</button>
</main>
<footer>© <span id="yr"></span> <a href="./">Harish Reddy Duggempudi</a></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="links-data.js"></script>
<script src="common.js"></script>
<script>
(function(){
  const {$,esc,icon,safe,ext,visible}=App,P=window.PROFILE,parts=P.name.split(' ');
  document.title=P.name+' | All my links';
  $('#name').innerHTML=esc(parts.slice(0,2).join(' '))+'<br><span>'+esc(parts.slice(2).join(' '))+'</span>';
  $('#bio').textContent=P.bio;
  $('#handle').textContent=P.handle;
  $('#photo').src=P.photo;
  $('#yr').textContent=new Date().getFullYear();
  $('#soc').innerHTML=window.SOCIALS.map(s=>`<a href="${esc(safe(s.url))}"${ext(s.url)} aria-label="${esc(s.name)}${/^https?:/i.test(s.url)?' (opens in a new tab)':''}" title="${esc(s.name)}">${icon(s.icon)}</a>`).join('');
  $('#list').innerHTML=visible(window.LINKS).map((l,i)=>{
    const cta=l.cta||'Open';
    const fresh=l.isNew||(l.added&&(Date.now()-new Date(l.added))/864e5<=(window.NEW_DAYS||14));
    return `<li style="--i:${i}"><a class="lk${l.featured?' f':''}" href="${esc(safe(l.url))}"${ext(l.url)}><span class="ic">${icon(l.icon)}</span><span class="tx"><b>${esc(l.title)}${fresh?'<span class="new">New</span>':''}</b>${l.desc?`<span>${esc(l.desc)}</span>`:''}</span><span class="ar"${l.featured?'':' aria-hidden="true"'}>${l.featured?esc(cta)+' ↗':'↗'}</span></a></li>`;
  }).join('');
  App.spotlight('#list','.lk');App.share(document.querySelector('#share'));App.theme();App.seo('links.html');
})();
</script>
</body>
</html>
